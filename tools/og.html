<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Generador de imagen para redes (1200×630)</title>
<meta name="robots" content="noindex, nofollow">
<!--
  GENERADOR DE OPEN GRAPH
  Abrir y capturar el lienzo a 1200×630 como assets/og.jpg.
  Sirve para regenerar la imagen cuando cambie el claim, sin abrir un editor.

  Para exportar a mano: abrir en Chrome, F12 -> Ctrl+Shift+P -> "Capture node
  screenshot" sobre el elemento .og. O correr tools/generar-og.md.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#333; display:grid; place-items:center; min-height:100vh; }

  /* lienzo exacto de Open Graph */
  .og{
    width:1200px; height:630px; position:relative; overflow:hidden;
    display:flex; flex-direction:column; justify-content:space-between;
    background:#0A0A0A; color:#EFEDE8;
    font-family:"Barlow",sans-serif; padding:60px 72px 0;
  }
  .og .tag{
    font-family:"Barlow Condensed",sans-serif; font-weight:600;
    font-size:21px; letter-spacing:.2em; text-transform:uppercase; color:#E02A33;
    border-left:4px solid #B4121B; padding-left:14px; line-height:1.3;
  }
  .og h1{
    font-family:"Barlow Condensed",sans-serif; font-weight:700;
    text-transform:uppercase; font-size:112px; line-height:.82; letter-spacing:-.02em;
    margin-top:26px;
  }
  .og h1 span{ display:block; }
  .og h1 .r{ color:#E02A33; }
  .og h1 .o{ -webkit-text-stroke:2px #EFEDE8; color:transparent; }
  .og .strip{
    background:#B4121B; margin:0 -72px; padding:20px 72px;
    display:flex; align-items:center; gap:26px;
    font-family:"Barlow Condensed",sans-serif; font-weight:600;
    font-size:22px; letter-spacing:.2em; text-transform:uppercase;
  }
  .og .strip i{
    width:7px; height:7px; background:currentColor; opacity:.6;
    transform:rotate(45deg); flex:none; display:block;
  }
  .og .strip .sp{ margin-left:auto; }
</style>
</head>
<body>

<div class="og">
  <div><p class="tag">Elecciones · Independiente</p>
  <h1><span>Por un nuevo</span><span class="r">Independiente,</span><span class="o">¡Para volver</span><span class="o">a ganar!</span></h1></div>
  <div class="strip"><span>Quique Sacco</span><i></i><span>Candidato a presidente</span><span class="sp">Plan a 4 años</span></div>
</div>
</body>
</html>
